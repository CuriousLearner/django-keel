# Lychee link checker configuration

# Exclude localhost URLs and development servers
exclude = [
    'http://localhost:*',
    'http://127.0.0.1:*',
    # StackOverflow returns 403 to automated link checkers
    'https://stackoverflow.com/.*',
]

# Accept 200-299 status codes as valid
accept = [200, 204, 206, 301, 302, 307, 308, 429]

# Retry failed requests, and give slow external sites room before treating a
# request as failed, so a transient timeout does not fail the docs build.
max_retries = 3
retry_wait_time = 2
timeout = 30

# User agent
user_agent = "Mozilla/5.0 (compatible; Lychee/1.0)"
