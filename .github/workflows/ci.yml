name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel superseded runs on the same branch/PR instead of stacking them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run mypy
        run: mypy tests/ --ignore-missing-imports

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0  # boot test runs uv inside generated projects

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.14'
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  test-generation:
    name: Test Template Generation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project-type: [saas, api, web-app, internal-tool]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Copier
        run: |
          python -m pip install --upgrade pip
          pip install 'copier>=9.14.3,<10'

      - name: Generate ${{ matrix.project-type }} project
        run: |
          PROJECT_SLUG=$(echo "test_${{ matrix.project-type }}" | sed 's/-/_/g')
          copier copy . ../test_${{ matrix.project-type }} \
            --data project_name="Test ${{ matrix.project-type }}" \
            --data project_slug="${PROJECT_SLUG}" \
            --data project_description="A test project for ${{ matrix.project-type }}" \
            --data author_name="Django Keel CI" \
            --data author_email="ci@django-keel.test" \
            --data project_type=${{ matrix.project-type }} \
            --defaults \
            --trust

      - name: Verify generated project structure
        run: |
          cd ../test_${{ matrix.project-type }}
          test -f pyproject.toml
          test -f Dockerfile
          test -f docker-compose.yml
          test -f Justfile
          test -d apps/
          test -d config/
          test -d tests/

      - name: Check for Jinja syntax errors
        run: |
          cd ../test_${{ matrix.project-type }}
          # Fail on unrendered copier syntax in generated output. GitHub Actions
          # ${{ ... }} expressions are allowed; bare copier {{ ... }} is not.
          # (A bare `! grep ...` is a no-op under `set -e`, and only the last
          # line would set the step's exit code, so check each explicitly.)
          leftover_var=$(grep -rn '{{' . --include="*.py" --include="*.md" --include="*.toml" | grep -v '\${{' || true)
          if [ -n "$leftover_var" ]; then
            echo "::error::Unrendered Jinja {{ ... }} found in generated project:"
            echo "$leftover_var"
            exit 1
          fi
          if grep -rn '{%' . --include="*.py" --include="*.md" --include="*.toml"; then
            echo "::error::Unrendered Jinja {% ... %} found in generated project"
            exit 1
          fi

      - name: Install generated project
        run: |
          cd ../test_${{ matrix.project-type }}
          uv sync --all-extras

      - name: Lint generated project (ruff + mypy)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          SECRET_KEY: ci-not-a-real-secret
        run: |
          cd ../test_${{ matrix.project-type }}
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .

      - name: Run generated project's test suite
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: ci-not-a-real-secret
        run: |
          cd ../test_${{ matrix.project-type }}
          uv run pytest -q

  test-version-matrix:
    name: Test Python + Django Versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Copier
        run: |
          python -m pip install --upgrade pip
          pip install 'copier>=9.14.3,<10'

      - name: Generate project with Python ${{ matrix.python-version }} + Django ${{ matrix.django-version }}
        run: |
          copier copy . ../test_versions \
            --data project_name="Test Versions" \
            --data project_slug="test_versions" \
            --data project_description="Test Python ${{ matrix.python-version }} + Django ${{ matrix.django-version }}" \
            --data author_name="Django Keel CI" \
            --data author_email="ci@django-keel.test" \
            --data python_version="${{ matrix.python-version }}" \
            --data django_version="${{ matrix.django-version }}" \
            --defaults \
            --trust

      - name: Verify Python version in pyproject.toml
        run: |
          cd ../test_versions
          grep -q 'requires-python = ">=${{ matrix.python-version }}"' pyproject.toml

      - name: Verify Django version in pyproject.toml
        run: |
          cd ../test_versions
          grep -q 'django.*${{ matrix.django-version }}' pyproject.toml

  validate-yaml:
    name: Validate YAML Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate YAML
        run: |
          find . -name "*.yml" -o -name "*.yaml" | \
          grep -v node_modules | \
          xargs yamllint -d relaxed

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: ./
          # Only set on pull_request events; empty on push so the action
          # derives the commit range from the push payload itself.
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # The template is full of intentional placeholder credentials;
          # only verified (live) secrets should fail the build.
          extra_args: --results=verified

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for git-revision-date plugin

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Check for broken links in docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --verbose --no-progress 'docs/**/*.md' 'README.md'
          fail: true
        continue-on-error: false

  all-checks:
    name: All Checks Passed
    needs: [lint, test, test-generation, test-version-matrix, validate-yaml, security, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all checks passed
        run: echo "All CI checks passed successfully!"
